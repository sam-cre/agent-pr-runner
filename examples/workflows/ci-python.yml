# Example CI for a Python repository. Copy to .github/workflows/ci.yml in your project.
# With one job, set ci.required_jobs to ["test"] in the runner config.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
